[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khai"
dynamic = ["version"]
description = "Official Python SDK for streaming chatbot turns to Khai for evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khai", email = "support@getkhai.ai" }]
keywords = ["khai", "llm", "evaluation", "chatbot", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20"]

[project.urls]
Homepage = "https://getkhai.ai"
Source = "https://github.com/KHAI-BE/khai-python"
Changelog = "https://github.com/KHAI-BE/khai-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/KHAI-BE/khai-python/issues"

[tool.hatch.version]
path = "src/khai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/khai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
